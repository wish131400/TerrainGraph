[[mods]]
modId="terraingraph"
version="${version}"
displayName="TerrainGraph"
displayTest="IGNORE_ALL_VERSION"
description='''
Reduces repeated density graph conversion during noise chunk initialization.
Each conversion cache belongs to one initialization and preserves the original
wrapping visitor. No client installation is required on a dedicated server.
'''

